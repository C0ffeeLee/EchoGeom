# Paths are relative to the release directory; absolute paths are also accepted.
# Set data_root for evaluation or audio for single-sample inference.
paths:
  data_root: null
  audio: null
  checkpoint: weights/echogeom_bv2.pt
  evaluation_output: results/bv2_test.json
  inference_output: results/depth.npy

runtime:
  device: auto              # auto, cpu, cuda, or cuda:N
  batch_size: 8
  num_workers: 0
  split: test               # test or val

audio:
  sample_rate: 44100
  crop_samples: 7782
  n_fft: 512
  win_length: 64
  hop_length: 16
  spectrum: magnitude      # magnitude or power
  image_size: [128, 128]

# These model settings construct the network and must match the chosen weight.
backbone:
  name: ssast_small
  embed_dim: 384
  num_layers: 12
  attention_heads: 6
  patch_size: 16
  patch_stride: 8
  feature_layers: [4, 8, 12]

binaural:
  interaction_layers: [4, 8]
  interaction_heads: 6
  fusion_dim: 256
  fusion_heads: 8

decoder:
  channels: [256, 192, 96, 48]
  readout_depths: [2, 1, 1]
  attention_heads: 8
  output_size: 128

normals:
  enabled: true
  hfov_deg: 86.0
  vfov_deg: 57.0
  patch_size: 5
  min_points: 6
  eval_mask: valid_neighborhood  # valid_neighborhood, valid, or all
